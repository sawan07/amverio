<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amverio Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef;
    --panel:#ffffff;
    --fg:#1c1e1f;
    --muted:#6b6f74;
    --line:#dcd7cd;
    --accent:#2f5d8a;
    --accent-fg:#ffffff;
    --bubble-user:#2f5d8a;
    --bubble-user-fg:#ffffff;
    --bubble-agent:#ffffff;
    --bubble-agent-fg:#1c1e1f;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171a;
      --panel:#1d2023;
      --fg:#e9e7e1;
      --muted:#9a9da3;
      --line:#34383d;
      --accent:#7fb0e0;
      --accent-fg:#101214;
      --bubble-user:#7fb0e0;
      --bubble-user-fg:#101214;
      --bubble-agent:#24272b;
      --bubble-agent-fg:#e9e7e1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171a;
    --panel:#1d2023;
    --fg:#e9e7e1;
    --muted:#9a9da3;
    --line:#34383d;
    --accent:#7fb0e0;
    --accent-fg:#101214;
    --bubble-user:#7fb0e0;
    --bubble-user-fg:#101214;
    --bubble-agent:#24272b;
    --bubble-agent-fg:#e9e7e1;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
    display:flex;
    flex-direction:column;
  }
  .app{
    max-width:720px;
    width:100%;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  /* ---------------------------------------------------------------- */
  /* Picker screen -- "who would you like to talk to?"                 */
  /* ---------------------------------------------------------------- */
  .picker{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 20px;
    gap:28px;
  }
  .picker-head{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .picker-head h1{
    margin:0;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.2px;
  }
  .picker-head p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  .domain-cards{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .domain-card{
    display:flex;
    flex-direction:column;
    gap:4px;
    text-align:left;
    width:100%;
    padding:16px 18px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--fg);
    font-family:inherit;
    cursor:pointer;
    transition:border-color 0.15s, transform 0.1s;
  }
  .domain-card:hover{border-color:var(--accent)}
  .domain-card:active{transform:scale(0.99)}
  .domain-card .domain-card-name{font-weight:600;font-size:16px}
  .domain-card .domain-card-tag{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:0.4px;
    color:var(--muted);
  }
  .picker-status{
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  /* ---------------------------------------------------------------- */
  /* Chat screen                                                        */
  /* ---------------------------------------------------------------- */
  .chat-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 18px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0}
  .brand .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .tag{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:0.4px;
    color:var(--muted);
    white-space:nowrap;
  }
  .header-actions{display:flex;gap:8px;flex:none}
  button.new-order{
    flex:none;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--accent-fg);
    background:var(--accent);
    border:none;
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
  }
  button.new-order:active{opacity:0.85}
  button.switch-agent{
    flex:none;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--fg);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
  }
  button.switch-agent:active{opacity:0.7}

  main{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .row{display:flex;min-width:0}
  .row.user{justify-content:flex-end}
  .row.agent{justify-content:flex-start}
  .bubble{
    max-width:80%;
    padding:10px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
    min-width:0;
  }
  .row.user .bubble{
    background:var(--bubble-user);
    color:var(--bubble-user-fg);
    border-bottom-right-radius:4px;
  }
  .row.agent .bubble{
    background:var(--bubble-agent);
    color:var(--bubble-agent-fg);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .row.system .bubble{
    background:transparent;
    border:1px dashed var(--line);
    color:var(--muted);
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
    margin:4px auto;
  }
  .row.system{justify-content:center}

  .typing{
    display:inline-flex;
    gap:4px;
    align-items:center;
    padding:4px 2px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s}
  .typing span:nth-child(3){animation-delay:0.3s}
  @keyframes bounce{
    0%,80%,100%{transform:scale(0.6);opacity:0.5}
    40%{transform:scale(1);opacity:1}
  }

  form{
    display:flex;
    gap:10px;
    padding:12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  textarea{
    flex:1;
    min-width:0;
    resize:none;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.4;
    padding:10px 14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--fg);
    max-height:120px;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  button.send{
    flex:none;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    color:var(--accent-fg);
    background:var(--accent);
    border:none;
    border-radius:14px;
    padding:0 18px;
    cursor:pointer;
  }
  button.send:disabled{opacity:0.5;cursor:default}

  .error-banner{
    margin:0 18px;
    padding:8px 12px;
    border-radius:10px;
    background:#a3702f22;
    border:1px solid var(--future, #a3702f);
    color:var(--fg);
    font-size:13px;
  }
</style>
</head>
<body>
  <div class="app">

    <div class="picker" id="picker">
      <div class="picker-head">
        <h1>Amverio</h1>
        <p>Choose who you'd like to talk to.</p>
      </div>
      <div class="domain-cards" id="domainCards"></div>
      <div class="picker-status" id="pickerStatus" hidden></div>
    </div>

    <div class="chat-screen" id="chatScreen" hidden>
      <header>
        <div class="brand">
          <span class="name" id="brandName">Amverio</span>
          <span class="tag" id="brandTag">AMVERIO DEMO</span>
        </div>
        <div class="header-actions">
          <button class="switch-agent" id="switchAgentBtn" type="button">Switch agent</button>
          <button class="new-order" id="newOrderBtn" type="button">New conversation</button>
        </div>
      </header>

      <main id="messages"></main>

      <form id="chatForm">
        <textarea id="input" rows="1" placeholder="Type a message…"></textarea>
        <button class="send" id="sendBtn" type="submit">Send</button>
      </form>
    </div>

  </div>

<script>
(function(){
  const pickerEl = document.getElementById('picker');
  const domainCardsEl = document.getElementById('domainCards');
  const pickerStatusEl = document.getElementById('pickerStatus');
  const chatScreenEl = document.getElementById('chatScreen');

  const messagesEl = document.getElementById('messages');
  const formEl = document.getElementById('chatForm');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const newOrderBtn = document.getElementById('newOrderBtn');
  const switchAgentBtn = document.getElementById('switchAgentBtn');
  const brandNameEl = document.getElementById('brandName');
  const brandTagEl = document.getElementById('brandTag');

  let threadId = null;
  let sending = false;
  let selectedDomainId = null;
  let domainsById = {};  // id -> {id, brand_name, brand_tag, greeting, new_conversation_label, input_placeholder}

  function addRow(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row agent';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  // ---- Picker screen -------------------------------------------------

  async function loadDomains(){
    try {
      const resp = await fetch('/api/domains');
      if (!resp.ok) throw new Error('bad response');
      const data = await resp.json();
      domainsById = {};
      (data.domains || []).forEach(function(d){ domainsById[d.id] = d; });
      renderDomainCards();
    } catch (e) {
      pickerStatusEl.hidden = false;
      pickerStatusEl.textContent = "Couldn't load the available agents. Please refresh.";
    }
  }

  function renderDomainCards(){
    domainCardsEl.innerHTML = '';
    Object.values(domainsById).forEach(function(d){
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'domain-card';
      const name = document.createElement('span');
      name.className = 'domain-card-name';
      name.textContent = d.brand_name;
      const tag = document.createElement('span');
      tag.className = 'domain-card-tag';
      tag.textContent = d.brand_tag;
      card.appendChild(name);
      card.appendChild(tag);
      card.addEventListener('click', function(){ selectDomain(d.id); });
      domainCardsEl.appendChild(card);
    });
  }

  async function selectDomain(domainId){
    selectedDomainId = domainId;
    const cfg = domainsById[domainId];
    if (!cfg) return;

    document.title = cfg.brand_name + ' — Amverio Demo';
    brandNameEl.textContent = cfg.brand_name;
    brandTagEl.textContent = cfg.brand_tag;
    newOrderBtn.textContent = cfg.new_conversation_label;
    inputEl.placeholder = cfg.input_placeholder;

    pickerEl.hidden = true;
    chatScreenEl.hidden = false;
    inputEl.focus();

    await startNewThread(true);
  }

  function backToPicker(){
    chatScreenEl.hidden = true;
    pickerEl.hidden = false;
    threadId = null;
    selectedDomainId = null;
    messagesEl.innerHTML = '';
  }

  // ---- Chat screen -----------------------------------------------------

  async function startNewThread(greet){
    if (!selectedDomainId) return;
    messagesEl.innerHTML = '';
    try {
      const resp = await fetch('/api/new-thread', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({domain: selectedDomainId})
      });
      if (!resp.ok){
        addRow('system', "Couldn't start a new conversation. Please try again.");
        return;
      }
      const data = await resp.json();
      threadId = data.thread_id;
    } catch (e) {
      addRow('system', "Couldn't reach the server. Please try again.");
      return;
    }
    if (greet){
      addRow('agent', domainsById[selectedDomainId].greeting);
    }
    inputEl.value = '';
    inputEl.style.height = 'auto';
    inputEl.focus();
  }

  async function sendMessage(text){
    sending = true;
    sendBtn.disabled = true;
    addRow('user', text);
    addTyping();
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({thread_id: threadId, message: text})
      });
      removeTyping();
      if (!resp.ok){
        const err = await resp.json().catch(()=>({detail: 'Something went wrong.'}));
        addRow('system', err.detail || ('Error ' + resp.status));
        return;
      }
      const data = await resp.json();
      addRow('agent', data.reply || '(no reply)');
    } catch (e) {
      removeTyping();
      addRow('system', "Couldn't reach the server. Please try again.");
    } finally {
      sending = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  formEl.addEventListener('submit', function(e){
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text || sending) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendMessage(text);
  });

  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  inputEl.addEventListener('input', function(){
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  newOrderBtn.addEventListener('click', function(){
    startNewThread(true);
  });

  switchAgentBtn.addEventListener('click', backToPicker);

  loadDomains();
})();
</script>
</body>
</html>
