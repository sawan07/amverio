<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DineSync — Amverio Restaurant Assistant Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Immediate Theme Initialization -->
<script>
  (function() {
    try {
      var saved = localStorage.getItem('amverio_theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch(e) {}
  })();
</script>
<style>
  :root{
    --bg:#070b14;
    --panel:#0d1526;
    --fg:#f1f5f9;
    --muted:#94a3b8;
    --line:#1e293b;
    --accent:#00f2fe;
    --accent-fg:#050811;
    --bubble-user:#0284c7;
    --bubble-user-fg:#ffffff;
    --bubble-agent:#131f37;
    --bubble-agent-fg:#f8fafc;
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"]{
    --bg:#f8fafc;
    --panel:#ffffff;
    --fg:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --accent:#0284c7;
    --accent-fg:#ffffff;
    --bubble-user:#0284c7;
    --bubble-user-fg:#ffffff;
    --bubble-agent:#f1f5f9;
    --bubble-agent-fg:#0f172a;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg:#070b14;
    --panel:#0d1526;
    --fg:#f1f5f9;
    --muted:#94a3b8;
    --line:#1e293b;
    --accent:#00f2fe;
    --accent-fg:#050811;
    --bubble-user:#0284c7;
    --bubble-user-fg:#ffffff;
    --bubble-agent:#131f37;
    --bubble-agent-fg:#f8fafc;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  /* .picker/.chat-screen set display:flex, which would otherwise beat the hidden attribute */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .ambient-glow {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(120px);
    opacity: 0.16;
  }
  .glow-1 {
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, #00f2fe, #0066ff);
    top: -180px;
    left: 20%;
  }
  .glow-2 {
    width: 550px;
    height: 550px;
    background: radial-gradient(circle, #0284c7, #10b981);
    bottom: -150px;
    right: 20%;
  }
  .app{
    max-width:980px;
    width:100%;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
    z-index:1;
    background:var(--bg);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
  }
  @media (max-width: 980px) {
    .app {
      border-left: none;
      border-right: none;
    }
  }

  /* ---------------------------------------------------------------- */
  /* Picker screen -- "who would you like to talk to?"                 */
  /* ---------------------------------------------------------------- */
  .picker{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 20px;
    gap:28px;
  }
  .picker-head{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .picker-head h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.2px;
  }
  .picker-head p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  .domain-cards{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .domain-card{
    display:flex;
    flex-direction:column;
    gap:4px;
    text-align:left;
    width:100%;
    padding:16px 18px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--fg);
    font-family:inherit;
    cursor:pointer;
    transition:border-color 0.15s, transform 0.1s;
  }
  .domain-card:hover{border-color:var(--accent)}
  .domain-card:active{transform:scale(0.99)}
  .domain-card .domain-card-name{font-weight:600;font-size:16px}
  .domain-card .domain-card-tag{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:0.4px;
    color:var(--muted);
  }
  .picker-status{
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  /* ---------------------------------------------------------------- */
  /* Chat screen                                                        */
  /* ---------------------------------------------------------------- */
  .chat-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-shrink:0;
    position:relative;
    z-index:10;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    flex:1 1 auto;
    overflow:hidden;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
    overflow:hidden;
  }
  .brand .name{
    font-weight:700;
    font-size:16px;
    color:var(--brand-fg, var(--fg));
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    letter-spacing:-0.2px;
  }
  .brand .tag{
    font-family:var(--tag-font, 'IBM Plex Mono',ui-monospace,monospace);
    font-size:11px;
    letter-spacing:0.5px;
    color:var(--tag-fg, var(--muted));
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:block;
  }
  .brand-logo{height:44px;width:auto;flex:none;display:block}
  .top-bar{
    background:var(--topbar-bg);
    color:var(--topbar-fg);
    font-size:12px;
    letter-spacing:0.3px;
    text-align:center;
    padding:7px 12px;
    padding-top: calc(7px + env(safe-area-inset-top, 0px));
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .theme-toggle-btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 3px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    transition: all 0.25s ease;
    outline: none;
  }
  .theme-toggle-btn:hover {
    border-color: var(--accent);
  }
  .theme-toggle-track {
    width: 44px;
    height: 22px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .theme-toggle-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    color: var(--accent-fg);
    position: absolute;
    left: 2px;
  }
  :root[data-theme="light"] .theme-toggle-thumb {
    transform: translateX(22px);
  }
  .icon-sun, .icon-moon {
    position: absolute;
    transition: all 0.25s ease;
  }
  .icon-sun {
    opacity: 0;
    transform: rotate(-60deg) scale(0.5);
  }
  .icon-moon {
    opacity: 1;
    transform: rotate(0) scale(1);
  }
  :root[data-theme="light"] .icon-sun {
    opacity: 1;
    transform: rotate(0) scale(1);
  }
  :root[data-theme="light"] .icon-moon {
    opacity: 0;
    transform: rotate(60deg) scale(0.5);
  }
  .amv-symbol-a {
    fill: #ffffff;
    filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.45));
    transition: fill 0.3s ease, filter 0.3s ease;
  }
  :root[data-theme="light"] .amv-symbol-a {
    fill: #0B1B36;
    filter: none;
  }
  button.new-order{
    flex-shrink: 0;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:#ffffff;
    background:linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    border:1px solid rgba(255, 255, 255, 0.25);
    border-radius:var(--btn-radius, 999px);
    padding:8px 16px;
    cursor:pointer;
    white-space: nowrap;
    box-shadow: 0 2px 10px rgba(2, 132, 199, 0.3);
    transition: all 0.2s ease;
  }
  button.new-order:hover{
    box-shadow: 0 4px 16px rgba(2, 132, 199, 0.5);
    transform: translateY(-1px);
  }
  button.new-order:active{transform: translateY(0); opacity:0.9}
  .switch-agent{
    flex-shrink: 0;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--fg);
    background:rgba(255, 255, 255, 0.05);
    border:1px solid var(--line);
    border-radius:var(--btn-radius, 999px);
    padding:8px 14px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    line-height:1;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  :root[data-theme="light"] .switch-agent {
    background: #ffffff;
    border-color: #cbd5e1;
  }
  .switch-agent:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(0, 242, 254, 0.08);
  }
  .switch-agent:active{opacity:0.7}

  .ba-badge-btn {
    flex-shrink: 0;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--fg);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    border-radius: var(--btn-radius, 999px);
    padding: 7px 11px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .ba-badge-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0, 242, 254, 0.08);
  }
  .ba-badge-btn.pro-active {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.16) 0%, rgba(2, 132, 199, 0.16) 100%);
    border-color: #10b981;
    color: #10b981;
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.3);
  }
  .ba-mode-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .ba-badge-btn.pro-active .ba-mode-dot {
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
    animation: pulseDot 2s infinite;
  }

  /* BA Unlock Modal */
  .ba-modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 8, 17, 0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .ba-modal-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  }
  .ba-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .ba-modal-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 700;
    color: var(--fg);
  }
  .ba-close-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
  }
  .ba-close-btn:hover { color: var(--fg); }
  .ba-modal-desc {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 16px 0;
  }
  .ba-error-msg {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #f87171;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    margin-bottom: 14px;
  }
  .ba-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .ba-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
  }
  .ba-field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .ba-field input {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    outline: none;
  }
  .ba-field input:focus {
    border-color: var(--accent);
  }
  .ba-submit-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    margin-top: 6px;
    transition: all 0.2s ease;
  }
  .ba-submit-btn:hover {
    box-shadow: 0 6px 18px rgba(2, 132, 199, 0.5);
    transform: translateY(-1px);
  }

  @media (max-width: 640px) {
    header {
      padding: 10px 14px;
      gap: 10px;
    }
    .brand .tag {
      display: none;
    }
    .switch-agent, button.new-order, .ba-badge-btn {
      padding: 6px 10px;
      font-size: 11.5px;
    }
  }

  /* ---------------------------------------------------------------- */
  /* Main chat feed                                                    */
  /* ---------------------------------------------------------------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* Welcome Banner Card */
  .hero-welcome-card {
    background: linear-gradient(145deg, rgba(13, 21, 38, 0.75) 0%, rgba(19, 31, 55, 0.45) 100%);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 20px;
    margin: 4px 0 10px 0;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeIn 0.3s ease;
  }
  :root[data-theme="light"] .hero-welcome-card {
    background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
    border-color: #e2e8f0;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
  }
  .welcome-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    color: #10b981;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
    animation: pulseDot 2s infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  .model-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.05);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .welcome-heading {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.3px;
  }
  .welcome-sub {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }
  .welcome-action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 4px;
  }
  @media (max-width: 600px) {
    .welcome-action-grid {
      grid-template-columns: 1fr;
    }
  }
  .welcome-action-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    color: var(--fg);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  :root[data-theme="light"] .welcome-action-btn {
    background: #ffffff;
    border-color: #e2e8f0;
  }
  .welcome-action-btn:hover {
    border-color: var(--accent);
    background: rgba(0, 242, 254, 0.06);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
  }
  .btn-emoji {
    font-size: 20px;
    flex-shrink: 0;
  }
  .btn-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .btn-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn-sub {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Chat Message Rows & Avatars */
  .row{
    display:flex;
    gap:10px;
    align-items:flex-end;
    min-width:0;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row.user{justify-content:flex-end}
  .row.agent{justify-content:flex-start}

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-bottom: 2px;
  }
  .agent-avatar {
    background: linear-gradient(135deg, #0b1528, #162444);
    border: 1px solid rgba(0, 242, 254, 0.3);
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    padding: 5px;
  }
  :root[data-theme="light"] .agent-avatar {
    background: #e2e8f0;
    border-color: #cbd5e1;
    box-shadow: none;
  }
  .agent-avatar svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .user-avatar {
    background: linear-gradient(135deg, #0284c7, #2563eb);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
  }

  .msg-content-wrap {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .row.user .msg-content-wrap {
    align-items: flex-end;
  }
  .row.agent .msg-content-wrap {
    align-items: flex-start;
  }

  .bubble{
    padding:12px 16px;
    border-radius:var(--bubble-radius, 18px);
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
    min-width:0;
  }
  .row.user .bubble{
    background:var(--bubble-user);
    color:var(--bubble-user-fg);
    border-bottom-right-radius:4px;
    box-shadow: 0 2px 10px rgba(2, 132, 199, 0.25);
  }
  .row.agent .bubble{
    background:var(--bubble-agent);
    color:var(--bubble-agent-fg);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }
  .bubble a{
    color:inherit;
    text-decoration:underline;
    text-underline-offset:2px;
    font-weight:600;
    word-break:break-all;
  }
  .row.agent .bubble a{
    color:var(--accent);
  }
  .row.user .bubble a{
    color:#ffffff;
  }
  .row.system .bubble{
    background:transparent;
    border:1px dashed var(--line);
    color:var(--muted);
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
    margin:4px auto;
  }
  .row.system{justify-content:center}

  .typing{
    display:inline-flex;
    gap:4px;
    align-items:center;
    padding:8px 12px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s}
  .typing span:nth-child(3){animation-delay:0.3s}
  @keyframes bounce{
    0%,80%,100%{transform:scale(0.6);opacity:0.5}
    40%{transform:scale(1);opacity:1}
  }

  /* ---------------------------------------------------------------- */
  /* Quick Chips bar above chat form                                    */
  /* ---------------------------------------------------------------- */
  .quick-chips-wrapper {
    padding: 8px 18px 4px 18px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .quick-chips-scroll {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 4px;
  }
  .quick-chips-scroll::-webkit-scrollbar {
    display: none;
  }
  .chips-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    white-space: nowrap;
    margin-right: 4px;
  }
  .chip-item {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--fg);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  :root[data-theme="light"] .chip-item {
    background: #f1f5f9;
  }
  .chip-item:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0, 242, 254, 0.08);
    transform: translateY(-1px);
  }
  .chip-item:active {
    transform: translateY(0);
  }

  /* ---------------------------------------------------------------- */
  /* Input Form                                                        */
  /* ---------------------------------------------------------------- */
  form{
    display:flex;
    gap:10px;
    padding:12px 18px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  textarea{
    flex:1;
    min-width:0;
    resize:none;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.4;
    padding:11px 16px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--fg);
    max-height:120px;
    transition: border-color 0.2s ease;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  button.send{
    flex-shrink:0;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    color:#ffffff;
    background:linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    border:1px solid rgba(255, 255, 255, 0.2);
    border-radius:var(--send-radius, 14px);
    padding:0 22px;
    cursor:pointer;
    box-shadow: 0 2px 10px rgba(2, 132, 199, 0.3);
    transition: all 0.2s ease;
  }
  button.send:hover:not(:disabled){
    box-shadow: 0 4px 16px rgba(2, 132, 199, 0.5);
    transform: translateY(-1px);
  }
  button.send:disabled{opacity:0.4;cursor:default}

  .error-banner{
    margin:0 18px;
    padding:8px 12px;
    border-radius:10px;
    background:#a3702f22;
    border:1px solid var(--future, #a3702f);
    color:var(--fg);
    font-size:13px;
  }
</style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="app">

    <div class="picker" id="picker">
      <div class="picker-head">
        <h1>Amverio</h1>
        <p>Choose who you'd like to talk to.</p>
      </div>
      <div class="domain-cards" id="domainCards"></div>

    <div class="chat-screen" id="chatScreen" hidden>
      <div class="top-bar" id="topBar" hidden></div>
      <header>
        <div class="brand-row">
          <svg style="width:36px; height:20px; flex-shrink:0; display:block;" viewBox="220 -20 1420 760" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="dmEyeGrad" x1="0%" y1="20%" x2="100%" y2="80%">
                <stop offset="0%" stop-color="#00d2fa" />
                <stop offset="50%" stop-color="#0099ff" />
                <stop offset="100%" stop-color="#0052e8" />
              </linearGradient>
              <radialGradient id="dmCoreGrad" cx="38%" cy="34%" r="65%">
                <stop offset="0%" stop-color="#80faff" />
                <stop offset="35%" stop-color="#00d4ff" />
                <stop offset="75%" stop-color="#0077ff" />
                <stop offset="100%" stop-color="#0044cc" />
              </radialGradient>
            </defs>
            <!-- Outer Cyber Eye Aperture -->
            <path d="M 268 378 C 420 120, 660 10, 924 10 C 1188 10, 1428 120, 1580 378 L 1358 604 L 1264 510 L 1386 386 C 1264 192, 1094 122, 924 122 C 754 122, 584 192, 462 386 L 584 510 L 490 604 Z" fill="url(#dmEyeGrad)" />
            <!-- The 'A' (White in dark mode, Navy in light mode) -->

        </div>
        <div class="header-actions">
          <button class="theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Toggle light or dark theme" title="Toggle Light / Dark mode">
            <span class="theme-toggle-track">
              <span class="theme-toggle-thumb">
                <svg class="icon-sun" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
              </span>
            </span>
          </button>
          <button type="button" class="ba-badge-btn" id="baModeBtn" title="BA Staff Live Demo Access">
            <span class="ba-mode-dot"></span>
            <span id="baModeText">BA Unlock 🔑</span>
          </button>
          <a href="/" class="switch-agent" id="switchAgentBtn">← Amverio Site</a>
          <a href="/admin" class="switch-agent">Admin Portal ↗</a>
          <button class="new-order" id="newOrderBtn" type="button">New order</button>
        </div>
      </header>

      <main id="messages"></main>

      <div class="quick-chips-wrapper" id="quickChipsWrapper">
        <div class="quick-chips-scroll">
          <span class="chips-label">Quick Prompts:</span>
          <button type="button" class="chip-item" data-msg="Can I see the dinner menu?">📋 View Menu</button>
          <button type="button" class="chip-item" data-msg="I'd like to order a chicken burger and skin-on fries for delivery">🍔 Order Burger</button>
          <button type="button" class="chip-item" data-msg="Can I book a table for 4 people tonight at 7:30 PM?">📅 Book Table</button>
          <button type="button" class="chip-item" data-msg="What are your opening hours and address?">📍 Hours & Location</button>
          <button type="button" class="chip-item" data-msg="How does online payment and delivery work?">💳 Payment Info</button>
        </div>
      </div>

      <form id="chatForm">
        <textarea id="input" rows="1" placeholder="Book a table or place an order…"></textarea>
        <button class="send" id="sendBtn" type="submit">Send</button>
      </form>
    </div>

  </div>

  <!-- BA Live Demo Unlock Modal -->
  <div class="ba-modal-overlay" id="baModal" style="display:none;">
    <div class="ba-modal-card">
      <div class="ba-modal-header">
        <div class="ba-modal-title">
          <span style="font-size:18px; color:var(--accent);">✦</span>
          <span>BA Live Demo Unlock</span>
        </div>
        <button type="button" class="ba-close-btn" id="closeBaModalBtn" aria-label="Close">✕</button>
      </div>
      <p class="ba-modal-desc">
        Sign in with authorized Amverio credentials to activate <strong>unrestricted GPT-4o live demo mode</strong> with zero rate limits for client presentations.
      </p>
      <div class="ba-error-msg" id="baErrorMsg" style="display:none;"></div>
      <form id="baLoginForm" class="ba-form">
        <div class="ba-field">
          <label for="baUsername">BA Username</label>
          <input type="text" id="baUsername" required autocomplete="username" placeholder="Username">
        </div>
        <div class="ba-field">
          <label for="baPassword">BA Password</label>
          <input type="password" id="baPassword" required autocomplete="current-password" placeholder="••••••••••••">
        </div>
        <button type="submit" class="ba-submit-btn" id="submitBaLoginBtn">Unlock Full Pro Mode</button>
      </form>
    </div>
  </div>

<script>
(function(){
  const pickerEl = document.getElementById('picker');
  const domainCardsEl = document.getElementById('domainCards');
  const pickerStatusEl = document.getElementById('pickerStatus');
  const chatScreenEl = document.getElementById('chatScreen');

  const messagesEl = document.getElementById('messages');
  const formEl = document.getElementById('chatForm');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const newOrderBtn = document.getElementById('newOrderBtn');
  const switchAgentBtn = document.getElementById('switchAgentBtn');
  const brandNameEl = document.getElementById('brandName');
  const brandTagEl = document.getElementById('brandTag');
  const brandLogoEl = document.getElementById('brandLogo');
  const topBarEl = document.getElementById('topBar');
  const rootEl = document.documentElement;
  let appliedVars = [];
  let currentAdminToken = localStorage.getItem('amverio_admin_token') || '';
  let isProMode = false;
  let activeModelName = 'gpt-4o-mini';

  // Per-agent branding. Inline vars on <html> override the default palette; clearTheme() puts it back.
  function applyTheme(theme){
    clearTheme();
    if (!theme) return;
    Object.entries(theme.vars || {}).forEach(function(kv){
      rootEl.style.setProperty(kv[0], kv[1]);
      appliedVars.push(kv[0]);
    });
    if (theme.color_scheme) rootEl.setAttribute('data-theme', theme.color_scheme);
    if (theme.logo_url && brandLogoEl){
      brandLogoEl.src = theme.logo_url;
      brandLogoEl.alt = '';
      brandLogoEl.hidden = false;
    }
    if (theme.top_bar && topBarEl){
      topBarEl.textContent = theme.top_bar;
      topBarEl.hidden = false;
    }
  }

  function clearTheme(){
    appliedVars.forEach(function(v){ rootEl.style.removeProperty(v); });
    appliedVars = [];
    var savedTheme = localStorage.getItem('amverio_theme') || 'dark';
    rootEl.setAttribute('data-theme', savedTheme);
    if (brandLogoEl) {
      brandLogoEl.hidden = true;
      brandLogoEl.removeAttribute('src');
    }
    if (topBarEl) {
      topBarEl.hidden = true;
    }
  }

  let threadId = null;
  let sending = false;
  let selectedDomainId = null;
  let domainsById = {};

  function escapeHtml(str){
    return (str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatMessage(text){
    let safe = escapeHtml(text || '');
    // Markdown links [text](https://...)
    safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    // Raw URLs (not preceded by href=")
    safe = safe.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    return safe;
  }

  function addRow(role, text){
    const row = document.createElement('div');
    row.className = 'row ' + role;

    if (role === 'agent') {
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar agent-avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.innerHTML = `<svg viewBox="220 -20 1420 760" fill="none">
        <path d="M 268 378 C 420 120, 660 10, 924 10 C 1188 10, 1428 120, 1580 378 L 1358 604 L 1264 510 L 1386 386 C 1264 192, 1094 122, 924 122 C 754 122, 584 192, 462 386 L 584 510 L 490 604 Z" fill="url(#dmEyeGrad)" />
        <path class="amv-symbol-a" d="M 854 220 C 882 165, 966 165, 994 220 L 1288 705 L 1140 705 L 924 355 L 708 705 L 560 705 Z" />
        <circle cx="924" cy="495" r="86" fill="url(#dmCoreGrad)" />
      </svg>`;
      row.appendChild(avatar);
    }

    const contentWrap = document.createElement('div');
    contentWrap.className = 'msg-content-wrap';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'system'){
      bubble.textContent = text;
    } else {
      bubble.innerHTML = formatMessage(text);
    }
    contentWrap.appendChild(bubble);
    row.appendChild(contentWrap);

    if (role === 'user') {
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar user-avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>`;
      row.appendChild(avatar);
    }

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'row agent';
    row.id = 'typingRow';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar agent-avatar';
    avatar.setAttribute('aria-hidden', 'true');
    avatar.innerHTML = `<svg viewBox="220 -20 1420 760" fill="none">
      <path d="M 268 378 C 420 120, 660 10, 924 10 C 1188 10, 1428 120, 1580 378 L 1358 604 L 1264 510 L 1386 386 C 1264 192, 1094 122, 924 122 C 754 122, 584 192, 462 386 L 584 510 L 490 604 Z" fill="url(#dmEyeGrad)" />
      <path class="amv-symbol-a" d="M 854 220 C 882 165, 966 165, 994 220 L 1288 705 L 1140 705 L 924 355 L 708 705 L 560 705 Z" />
      <circle cx="924" cy="495" r="86" fill="url(#dmCoreGrad)" />
    </svg>`;
    row.appendChild(avatar);

    const contentWrap = document.createElement('div');
    contentWrap.className = 'msg-content-wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    contentWrap.appendChild(bubble);
    row.appendChild(contentWrap);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  // Quick send helper available globally
  window.quickSend = function(text) {
    if (sending) return;
    inputEl.value = text;
    formEl.requestSubmit();
  };

  // Wire quick chip clicks
  document.addEventListener('click', function(e){
    const chip = e.target.closest('.chip-item');
    if (chip) {
      const msg = chip.getAttribute('data-msg');
      if (msg) quickSend(msg);
    }
  });

  // Render hero welcome card
  function renderWelcomeCard(cfg){
    const card = document.createElement('div');
    card.className = 'hero-welcome-card';
    const statusLabel = isProMode ? 'BA Mode Active' : 'Public Demo Online';
    const badgeLabel = isProMode ? 'GPT-4o Pro (Unlimited)' : 'GPT-4o-mini (Protected)';
    card.innerHTML = `
      <div class="welcome-header">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span>${statusLabel}</span>
        </div>
        <span class="model-badge">${badgeLabel}</span>
      </div>
      <h3 class="welcome-heading">${escapeHtml(cfg.brand_name || 'The Copper Fork')}</h3>
      <p class="welcome-sub">I'm your 24/7 restaurant assistant. Ask for menus, place food delivery orders with Stripe payment, or reserve a table instantly.</p>
      <div class="welcome-action-grid">
        <button type="button" class="welcome-action-btn" onclick="quickSend('Can I see the dinner menu?')">
          <span class="btn-emoji">📋</span>
          <div class="btn-text">
            <span class="btn-title">View Menu</span>
            <span class="btn-sub">Starters, mains & drinks</span>
          </div>
        </button>
        <button type="button" class="welcome-action-btn" onclick="quickSend('I\\'d like to order a chicken burger and skin-on fries for delivery')">
          <span class="btn-emoji">🍔</span>
          <div class="btn-text">
            <span class="btn-title">Order Food</span>
            <span class="btn-sub">Delivery or pickup</span>
          </div>
        </button>
        <button type="button" class="welcome-action-btn" onclick="quickSend('Can I book a table for 4 people tonight at 7:30 PM?')">
          <span class="btn-emoji">📅</span>
          <div class="btn-text">
            <span class="btn-title">Book Table</span>
            <span class="btn-sub">Instant reservation</span>
          </div>
        </button>
        <button type="button" class="welcome-action-btn" onclick="quickSend('What are your opening hours and address?')">
          <span class="btn-emoji">📍</span>
          <div class="btn-text">
            <span class="btn-title">Hours & Location</span>
            <span class="btn-sub">Covent Garden, London</span>
          </div>
        </button>
      </div>
    `;
    messagesEl.appendChild(card);
  }

  // ---- Picker screen -------------------------------------------------

  async function loadDomains(){
    try {
      const resp = await fetch('/api/domains');
      if (!resp.ok) throw new Error('bad response');
      const data = await resp.json();
      domainsById = {};
      (data.domains || []).forEach(function(d){ domainsById[d.id] = d; });
      const dedicated = pagePath && Object.values(domainsById).find(function(d){ return d.path === pagePath; });
      if (dedicated || pagePath === 'restaurant' || pagePath === 'demo' || Object.keys(domainsById).length === 1){
        const targetId = dedicated ? dedicated.id : (domainsById['restaurant'] ? 'restaurant' : Object.keys(domainsById)[0]);
        selectDomain(targetId);
        return;
      }
      renderDomainCards();
    } catch (e) {
      pickerEl.hidden = false;
      pickerStatusEl.hidden = false;
      pickerStatusEl.textContent = "Couldn't load the available agents. Please refresh.";
    }
  }

  const pagePath = location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
  let dedicatedDomainId = null;
  if (pagePath) pickerEl.hidden = true;

  function renderDomainCards(){
    domainCardsEl.innerHTML = '';
    Object.values(domainsById).filter(function(d){ return d.listed !== false; }).forEach(function(d){
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'domain-card';
      const name = document.createElement('span');
      name.className = 'domain-card-name';
      name.textContent = d.brand_name;
      const tag = document.createElement('span');
      tag.className = 'domain-card-tag';
      tag.textContent = d.brand_tag;
      card.appendChild(name);
      card.appendChild(tag);
      card.addEventListener('click', function(){ selectDomain(d.id); });
      domainCardsEl.appendChild(card);
    });
  }

  async function selectDomain(domainId){
    selectedDomainId = domainId;
    const cfg = domainsById[domainId];
    if (!cfg) return;

    document.title = dedicatedDomainId ? cfg.brand_name + ' — Instant Booking' : cfg.brand_name + ' — Amverio Demo';
    if (brandNameEl) brandNameEl.textContent = cfg.brand_name;
    if (brandTagEl) brandTagEl.textContent = cfg.brand_tag;
    if (newOrderBtn) newOrderBtn.textContent = cfg.new_conversation_label;
    if (inputEl) inputEl.placeholder = cfg.input_placeholder;
    applyTheme(cfg.theme);

    if (pickerEl) pickerEl.hidden = true;
    if (chatScreenEl) chatScreenEl.hidden = false;
    if (inputEl) inputEl.focus();

    await startNewThread(true);
  }

  function backToPicker(){
    clearTheme();
    chatScreenEl.hidden = true;
    pickerEl.hidden = false;
    threadId = null;
    selectedDomainId = null;
    messagesEl.innerHTML = '';
  }

  // ---- Chat screen -----------------------------------------------------

  async function startNewThread(greet){
    if (!selectedDomainId) return;
    messagesEl.innerHTML = '';
    const cfg = domainsById[selectedDomainId] || {};
    if (greet){
      renderWelcomeCard(cfg);
    }
    try {
      const resp = await fetch('/api/new-thread', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({domain: selectedDomainId})
      });
      if (!resp.ok){
        addRow('system', "Couldn't start a new conversation. Please try again.");
        return;
      }
      const data = await resp.json();
      threadId = data.thread_id;
    } catch (e) {
      addRow('system', "Couldn't reach the server. Please try again.");
      return;
    }
    if (greet && cfg.greeting){
      addRow('agent', cfg.greeting);
    }
    inputEl.value = '';
    inputEl.style.height = 'auto';
    inputEl.focus();
  }

  async function sendMessage(text){
    sending = true;
    sendBtn.disabled = true;
    addRow('user', text);
    addTyping();
    try {
      const headers = {'Content-Type': 'application/json'};
      if (currentAdminToken) {
        headers['Authorization'] = 'Bearer ' + currentAdminToken;
      }
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({thread_id: threadId, message: text})
      });
      removeTyping();
      if (!resp.ok){
        const err = await resp.json().catch(()=>({detail: 'Something went wrong.'}));
        addRow('system', err.detail || ('Error ' + resp.status));
        return;
      }
      const data = await resp.json();
      addRow('agent', data.reply || '(no reply)');
    } catch (e) {
      removeTyping();
      addRow('system', "Couldn't reach the server. Please try again.");
    } finally {
      sending = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  formEl.addEventListener('submit', function(e){
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text || sending) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendMessage(text);
  });

  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  inputEl.addEventListener('input', function(){
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  if (newOrderBtn) {
    newOrderBtn.addEventListener('click', function(){
      startNewThread(true);
    });
  }

  if (switchAgentBtn) {
    switchAgentBtn.addEventListener('click', function(e){
      if (switchAgentBtn.tagName === 'A' && switchAgentBtn.getAttribute('href') && switchAgentBtn.getAttribute('href') !== '#') {
        return;
      }
      e.preventDefault();
      backToPicker();
    });
  }

  const themeToggleBtn = document.getElementById('themeToggleBtn');
  function updateThemeUI(theme) {
    if (!themeToggleBtn) return;
    const next = theme === 'light' ? 'dark' : 'light';
    themeToggleBtn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
    themeToggleBtn.setAttribute('title', 'Switch to ' + next + ' theme');
  }

  const initialTheme = rootEl.getAttribute('data-theme') || 'dark';
  updateThemeUI(initialTheme);

  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', function() {
      const current = rootEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      rootEl.setAttribute('data-theme', next);
      try {
        localStorage.setItem('amverio_theme', next);
      } catch(e) {}
      updateThemeUI(next);
    });
  }

  const baModeBtn = document.getElementById('baModeBtn');
  const baModal = document.getElementById('baModal');
  const closeBaModalBtn = document.getElementById('closeBaModalBtn');
  const baLoginForm = document.getElementById('baLoginForm');
  const baErrorMsg = document.getElementById('baErrorMsg');
  const submitBaLoginBtn = document.getElementById('submitBaLoginBtn');

  async function checkAuthStatus() {
    try {
      const headers = {};
      if (currentAdminToken) headers['Authorization'] = 'Bearer ' + currentAdminToken;
      const resp = await fetch('/api/auth-status', { headers });
      if (resp.ok) {
        const data = await resp.json();
        isProMode = !!data.authenticated;
        activeModelName = data.model || (isProMode ? 'gpt-4o' : 'gpt-4o-mini');
        updateBaModeUI();
        return isProMode;
      }
    } catch(e) {}
    isProMode = false;
    activeModelName = 'gpt-4o-mini';
    updateBaModeUI();
    return false;
  }

  function updateBaModeUI() {
    const text = document.getElementById('baModeText');
    if (!baModeBtn || !text) return;
    if (isProMode) {
      baModeBtn.classList.add('pro-active');
      text.textContent = '✦ BA Mode (' + activeModelName + ')';
      baModeBtn.title = 'Authorized BA Demo Active: Unrestricted ' + activeModelName + '. Click to sign out.';
    } else {
      baModeBtn.classList.remove('pro-active');
      text.textContent = 'BA Unlock 🔑';
      baModeBtn.title = 'Click to sign in with BA credentials and unlock unrestricted GPT-4o mode';
    }
    const welcomeCard = document.querySelector('.hero-welcome-card');
    if (welcomeCard) {
      const statusDotSpan = welcomeCard.querySelector('.status-indicator span:last-child');
      const modelBadge = welcomeCard.querySelector('.model-badge');
      if (statusDotSpan) statusDotSpan.textContent = isProMode ? 'BA Mode Active' : 'Public Demo Online';
      if (modelBadge) modelBadge.textContent = isProMode ? 'GPT-4o Pro (Unlimited)' : 'GPT-4o-mini (Protected)';
    }
  }

  if (baModeBtn) {
    baModeBtn.addEventListener('click', function() {
      if (isProMode) {
        if (confirm("You are currently in BA Live Demo Mode (Unrestricted " + activeModelName + "). Sign out and return to Public Demo Mode?")) {
          currentAdminToken = '';
          localStorage.removeItem('amverio_admin_token');
          fetch('/api/admin/logout', { method: 'POST' }).catch(()=>{});
          isProMode = false;
          activeModelName = 'gpt-4o-mini';
          updateBaModeUI();
          startNewThread(true);
        }
      } else {
        if (baErrorMsg) baErrorMsg.style.display = 'none';
        if (baModal) baModal.style.display = 'flex';
        const userInp = document.getElementById('baUsername');
        if (userInp) userInp.focus();
      }
    });
  }

  if (closeBaModalBtn) {
    closeBaModalBtn.addEventListener('click', function() {
      if (baModal) baModal.style.display = 'none';
    });
  }

  if (baModal) {
    baModal.addEventListener('click', function(e) {
      if (e.target === baModal) {
        baModal.style.display = 'none';
      }
    });
  }

  if (baLoginForm) {
    baLoginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      if (baErrorMsg) baErrorMsg.style.display = 'none';
      submitBaLoginBtn.disabled = true;
      submitBaLoginBtn.textContent = 'Verifying…';

      const username = document.getElementById('baUsername').value.trim();
      const password = document.getElementById('baPassword').value.trim();

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          currentAdminToken = data.token;
          localStorage.setItem('amverio_admin_token', data.token);
          if (baModal) baModal.style.display = 'none';
          await checkAuthStatus();
          startNewThread(true);
        } else {
          if (baErrorMsg) {
            baErrorMsg.textContent = data.detail || 'Invalid username or password.';
            baErrorMsg.style.display = 'block';
          }
        }
      } catch (err) {
        if (baErrorMsg) {
          baErrorMsg.textContent = 'Connection error. Please try again.';
          baErrorMsg.style.display = 'block';
        }
      } finally {
        submitBaLoginBtn.disabled = false;
        submitBaLoginBtn.textContent = 'Unlock Full Pro Mode';
      }
    });
  }

  (async function init() {
    const isAuthed = await checkAuthStatus();
    if (window.location.pathname.includes('client-demo')) {
      if (!isAuthed && baModal) {
        baModal.style.display = 'flex';
      }
    }
    await loadDomains();
  })();
})();
</script>
</body>
</html>
